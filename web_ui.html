" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',spark:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/>',filter:'<path d="M3 4h18l-7 8v6l-4 3v-9L3 4z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-7 5-7 13 0 18M12 3c7 5 7 13 0 18"/>',tag:'<path d="m3 12 9 9 9-9-9-9H3v9z"/><circle cx="8" cy="8" r="1"/>',file:'<path d="M6 3h9l5 5v13H6V3zm9 0v6h5"/>',menu:'<path d="M3 6h18M3 12h18M3 18h18"/>'};
const ic=(n,extra='')=>`<svg class="ico ${extra}" viewBox="0 0 24 24">${icons[n]||icons.spark}</svg>`;
const B=(text,cls='',icon='',attr='')=>`<button class="btn ${cls}" ${attr}>${icon?ic(icon):''}${text}</button>`;
const nav=(active='games')=>`<aside class="side"><div class="brand"><div class="brand-mark">Q</div><div><div class="brand-name">QUIZ STUDIO</div><div class="brand-small">GAME CREATOR</div></div></div><div class="nav-item ${active==='games'?'active':''}" data-go="library">${ic('game')} Mis juegos</div><div class="nav-item ${active==='history'?'active':''}" data-go="history">${ic('history')} Historial</div><div class="side-bottom"><div class="helper"><strong>${ic('info','sm')} Tus trivias, a tu estilo</strong>Crea juegos, personaliza sus colores y conserva cada partida.</div><div class="kbd"><span>Pantalla completa</span><span class="key">F11</span></div></div></aside>`;
const app=(body,active='games',cls='')=>`<div class="screen ${cls}"><div class="app">${nav(active)}<main class="workspace ${cls}">${body}</main></div></div>`;
const header=(eyebrow,title,sub,actions='')=>`<header class="page-header"><div><div class="page-kicker">${eyebrow}</div><h1 class="text-h">${title}</h1><div class="subtitle">${sub}</div></div><div>${actions}</div></header>`;
const games=[['Reto de cultura general','Cultura general','5 categorías · 25 preguntas','10/10/2026 · 11:40','#2941a3','#315bd1','globe','●'],['Cine y series','Entretenimiento','4 categorías · 20 preguntas','08/10/2026 · 18:20','#9d365e','#c64765','play','▣'],['Historia del Perú','Historia','6 categorías · 30 preguntas','04/10/2026 · 09:12','#885029','#a96d3b','book','◆'],['Música 2000','Música','4 categorías · 25 preguntas','02/10/2026 · 19:15','#4936a3','#6d48c0','spark','♫'],['Deportes','Competencia','5 categorías · 30 preguntas','28/09/2026 · 12:00','#21665a','#267f70','target','◈'],['Ciencia para todos','Aprendizaje','5 categorías · 25 preguntas','19/09/2026 · 15:45','#2b5377','#366f91','spark','✧']];
function gameCard(g,i){return `<div class="game-card"><div class="game-art" style="background:linear-gradient(120deg,${g[4]},${g[5]})"><div class="art-tag">${g[1].toUpperCase()}</div><div class="art-orb">${g[7]}</div><div class="art-title">${g[0]}</div></div><div class="card-body"><div class="card-name">${g[0]}</div><div class="card-meta"><span>${g[2]}</span><span>${ic('history','sm')} ${g[3]}</span></div><div class="card-actions">${B('Editar','btn-quiet btn-grow','pencil',`data-go="identity"`)}${B('Jugar','btn-primary btn-grow','play',`data-go="prepare"`)}${B('','btn-quiet btn-icon','more',`data-go="menu"`)}</div></div></div>`}
function library(menu=false){return app(`${header('Biblioteca','Mis juegos','Crea una trivia para cada ocasión y vuelve a jugarla cuando quieras.',B('Crear juego','btn-primary btn-lg','plus','data-go="identity"'))}<div class="cards">${games.map(gameCard).join('')}</div>${menu?`<div class="menu" style="left:1044px;top:393px"><div class="menu-row hov">${ic('copy')} Duplicar juego</div><div class="menu-row">${ic('history')} Ver historial de este juego</div><div class="menu-row bad">${ic('trash')} Eliminar juego</div></div>`:''}`)}
function empty(){return app(`${header('Biblioteca','Mis juegos','Crea una trivia para cada ocasión y vuelve a jugarla cuando quieras.',B('Crear juego','btn-primary btn-lg','plus','data-go="identity"'))}<div class="empty"><div class="empty-ico">${ic('game','xl')}</div><h2>Aún no hay juegos</h2><p>Crea el primero para empezar a diseñar tus preguntas, equipos y estilo de juego.</p>${B('Crear mi primer juego','btn-primary btn-lg','plus','data-go="identity"')}</div>`)}
function editorHead(){return `<div class="editor-head"><div class="editor-back"><button class="btn btn-quiet btn-icon" data-go="library">${ic('arrow')}</button><div><div class="editor-title">Configuración del juego</div><div class="editor-meta">Reto de cultura general <span style="color:#657596"> · </span> Cambios sin guardar</div></div></div><div class="vcenter gap12">${B('Cancelar','btn-quiet','close','data-go="library"')}${B('Guardar juego','btn-primary','save','data-go="library"')}</div></div>`}
function tabs(active){return `<div class="editor-tabs">${[['identity','Identidad visual','palette'],['teams','Equipos','users'],['questions','Categorías y preguntas','list']].map(t=>`<div class="tab ${active===t[0]?'active':''}" data-go="${t[0]}">${ic(t[2])}${t[1]}</div>`).join('')}</div>`}
function colored(hex){return `<div class="color-field"><span class="swatch" style="background:${hex}"></span><div class="inp">${hex.toUpperCase()}</div><button class="btn btn-quiet btn-icon">${ic('palette','sm')}</button></div>`}
function preBoard(){return `<div class="mini-preview"><div class="preview-score"><span>Águilas <b>90</b></span><span>Titanes <b>120</b></span><span>Nova <b>60</b></span></div><div class="preview-title">RETO DE CULTURA GENERAL</div><div class="preview-board">${['Ciencia','Historia','Deportes','Arte'].map((c,i)=>`<div class="preview-col"><b style="border-top-color:${['#37d6b1','#d6a463','#6490ef','#ba8df1'][i]}">${c}</b>${[50,40,30,20].map(p=>`<span>${p}</span>`).join('')}</div>`).join('')}</div></div>`}
function identity(){return app(`${editorHead()}${tabs('identity')}<div class="style-grid"><section class="panel style-left"><h3 class="group-title">Información del juego</h3><div class="form2"><div><label class="field-label">Nombre interno *</label><div class="inp">Reto de cultura general</div></div><div><label class="field-label">Título visible *</label><div class="inp">RETO DE CULTURA GENERAL</div></div></div><div class="line" style="margin:26px 0 23px"></div><h3 class="group-title">Personalización visual</h3><div class="form2"><div><label class="field-label">Color de fondo</label>${colored('#0F1829')}</div><div><label class="field-label">Color destacado</label>${colored('#687DFF')}</div><div><label class="field-label">Color del texto</label>${colored('#F4F7FF')}</div><div><label class="field-label">Color de tarjetas</label>${colored('#25354F')}</div><div><label class="field-label">Tipografía</label><div class="select">Inter ${ic('chev','sm')}</div></div><div><label class="field-label">Imagen de fondo (opcional)</label><div class="vcenter gap8"><div class="inp muted">Ninguna seleccionada</div>${B('Examinar','btn-quiet','image')}</div></div></div><p class="mini-note" style="margin-top:22px">Si no hay imagen, se utilizará el color de fondo del juego.</p></section><section class="panel style-right"><div class="between" style="margin-bottom:18px"><h3 class="group-title" style="margin:0">Vista previa del juego</h3><span class="chip">${ic('grid','sm')} En vivo</span></div>${preBoard()}<div class="between" style="margin-top:17px"><span class="note">Los cambios se reflejan mientras editas.</span><span class="tiny muted">Vista orientativa</span></div></section></div>`,'games','editor-work')}
function teamLine(i,n,c){return `<div class="team-line"><div class="team-order">0${i}</div><div class="inp">${n}</div><span class="swatch" style="background:${c}"></span><div class="inp">${c.toUpperCase()}</div><button class="btn btn-quiet btn-icon">${ic('palette','sm')}</button></div>`}
function teams(){let names=['Águilas','Titanes','Nova','Órbita'],clrs=['#5286FF','#F46A7B','#3CDAAE','#F6BD63'];return app(`${editorHead()}${tabs('teams')}<div class="team-top"><section class="panel team-lists"><div class="between"><div><h3 class="group-title" style="margin-bottom:5px">Equipos predeterminados</h3><div class="note">Puedes ajustar estos datos para cada nueva partida.</div></div><div class="vcenter gap12"><span class="muted small">Cantidad</span>${B('−','btn-quiet btn-icon')}<strong>4</strong>${B('+','btn-quiet btn-icon')}</div></div><div class="between tiny muted" style="margin-top:25px"><span>Orden &nbsp; &nbsp; Nombre del equipo</span><span style="margin-right:118px">Color asignado</span></div>${names.map((n,i)=>teamLine(i+1,n,clrs[i])).join('')}<div class="vcenter gap12" style="margin-top:28px">${B('Agregar equipo','btn-quiet','plus')}<span class="note">Mínimo 2 · Máximo 8 equipos</span></div></section><section class="panel team-preview"><h3 class="group-title">Vista del marcador</h3><div class="note" style="margin-bottom:26px">Ejemplo en una partida en vivo</div>${names.map((n,i)=>`<div class="team-mini" style="border-left:4px solid ${clrs[i]}"><span class="dot" style="background:${clrs[i]}"></span>${n}<b>${[90,120,60,40][i]}</b></div>`).join('')}<div class="line" style="margin:29px 0 22px"></div><div class="note">Los nombres y colores definidos aquí se usarán como base. No modifican los resultados anteriores.</div></section></div>`,'games','editor-work')}
const categories=[['Ciencia',5,'#43dab0'],['Historia',5,'#e4ac62'],['Deportes',5,'#6f9cf9'],['Arte',5,'#bb8bef'],['Geografía',5,'#ef8f7b']];
const qs=[['50','¿Cuál es el planeta más grande del sistema solar?','Júpiter'],['40','¿Cuál es el símbolo químico del oro?','Au'],['30','¿Qué instrumento mide la temperatura?','Termómetro'],['20','¿Cuántos huesos tiene el ser humano adulto?','206'],['10','¿Cómo se llama la galaxia que habitamos?','Vía Láctea']];
function qColumns(){return `<div class="question-columns"><section class="panel category-list"><div class="between"><h3 class="group-title" style="margin:0">Categorías</h3>${B('','btn-primary btn-icon','plus','data-go="categoryModal"')}</div><div class="note" style="margin:12px 0 15px">Organiza el tablero por temas.</div>${categories.map((c,i)=>`<div class="category-row ${i===0?'active':''}"><span class="dot" style="background:${c[2]}"></span>${c[0]}<span class="count-pill">${c[1]}</span></div>`).join('')}<div class="vcenter gap8" style="margin-top:23px">${B('Editar','btn-quiet','pencil','data-go="categoryModal"')}${B('Eliminar','btn-quiet','trash')}</div></section><section class="panel question-table"><div class="toolbar"><div><h3 class="group-title" style="margin:0 0 5px">Preguntas · Ciencia</h3><div class="note">5 cartas ordenadas de mayor a menor puntaje</div></div>${B('Nueva pregunta','btn-primary','plus','data-go="questionModal"')}</div><div class="table-head"><span>Valor</span><span>Pregunta</span><span>Respuesta</span><span>Acciones</span></div>${qs.map((q,i)=>`<div class="question-row" style="${i===0?'background:#263650;border-radius:9px;':''}"><div><span class="value-tag">${q[0]}</span></div><div class="value-trunc">${q[1]}</div><div class="value-trunc muted">${q[2]}</div><div class="vcenter gap12"><span data-go="questionModal">${ic('pencil','sm')}</span>${ic('more','sm')}</div></div>`).join('')}<div class="between" style="margin-top:27px"><span class="note">Selecciona una pregunta para editarla, duplicarla o eliminarla.</span>${B('Duplicar seleccionada','btn-quiet','copy')}</div></section></div>`}
function questions(){return app(`${editorHead()}${tabs('questions')}${qColumns()}`,'games','editor-work')}
function overlay(base,content){return base.replace('</div></div></div></div>','</div></div></div></div>')+`<div class="dim"></div>${content}`}
function modalContent(html,width=600){return `<div class="dialog" style="width:${width}px">${html}</div>`}
function categoryModal(){return overlay(questions(),modalContent(`<div class="modal-heading"><div><h2>Editar categoría</h2><div class="note">Define cómo aparecerá en el tablero.</div></div><button class="btn btn-quiet btn-icon" data-go="questions">${ic('close')}</button></div><label class="field-label">Nombre de la categoría *</label><div class="inp">Ciencia</div><div style="margin-top:20px"><label class="field-label">Color identificador</label>${colored('#43DAB0')}</div><div class="modal-foot">${B('Cancelar','btn-quiet','','data-go="questions"')}${B('Guardar categoría','btn-primary','check','data-go="questions"')}</div>`,570))}
function questionModal(){return overlay(questions(),modalContent(`<div class="modal-heading"><div><h2>Editar pregunta</h2><div class="note">Categoría: Ciencia</div></div><button class="btn btn-quiet btn-icon" data-go="questions">${ic('close')}</button></div><div style="display:grid;grid-template-columns:1.25fr .82fr;gap:27px"><div><label class="field-label">Valor de la carta *</label><div class="inp" style="width:170px">30</div><div style="margin-top:19px"><label class="field-label">Pregunta *</label><textarea class="area" readonly>¿Cuál es el planeta más grande del sistema solar?</textarea></div><div style="margin-top:18px"><label class="field-label">Alternativas (una por línea)</label><textarea class="area" style="height:124px" readonly>Marte\nJúpiter\nSaturno\nNeptuno</textarea></div><div style="margin-top:18px"><label class="field-label">Respuesta correcta *</label><div class="inp">Júpiter</div></div></div><div><label class="field-label">Imagen de la pregunta (opcional)</label><div class="qillustration stars" style="width:100%;height:265px"><div class="jupiter"></div></div><div class="vcenter gap8" style="margin-top:12px">${B('Examinar','btn-quiet','image')}${B('Quitar','btn-quiet','trash')}</div><p class="note" style="margin-top:22px">Se admite una ruta local. Si la imagen no se encuentra, la pregunta se mostrará solo con texto.</p></div></div><div class="modal-foot">${B('Cancelar','btn-quiet','','data-go="questions"')}${B('Guardar pregunta','btn-primary','check','data-go="questions"')}</div>`,1000))}
function prepare(){return overlay(library(),modalContent(`<div class="modal-heading"><div><div class="page-kicker">Antes de comenzar</div><h2 style="font-size:30px">Preparar partida</h2><div class="note">Reto de cultura general · Los cambios solo se aplican a esta partida.</div></div><button class="btn btn-quiet btn-icon" data-go="library">${ic('close')}</button></div><div class="panel" style="padding:20px;margin-bottom:17px"><div class="between"><div class="vcenter gap12">${ic('users')} <strong>Cantidad de equipos</strong></div><div class="vcenter gap12">${B('−','btn-quiet btn-icon')}<strong style="font-size:22px">4</strong>${B('+','btn-quiet btn-icon')}</div></div></div><div class="note" style="margin-bottom:12px">Personaliza los nombres y colores para esta ocasión:</div>${['Águilas','Titanes','Nova','Órbita'].map((n,i)=>`<div style="display:flex;align-items:center;gap:14px;margin:9px 0;background:#111d31;padding:12px 14px;border:1px solid #32465f;border-radius:11px"><span class="dot" style="width:21px;height:21px;background:${['#5286FF','#F46A7B','#3CDAAE','#F6BD63'][i]}"></span><span class="inp" style="flex:1">${n}</span><span class="small muted">Equipo ${i+1}</span><span class="swatch" style="width:32px;height:32px;flex-basis:32px;background:${['#5286FF','#F46A7B','#3CDAAE','#F6BD63'][i]}"></span></div>`).join('')}<div class="modal-foot">${B('Cancelar','btn-quiet','','data-go="library"')}${B('Iniciar partida','btn-primary btn-lg','play','data-go="board"')}</div>`,742))}
const teamsDefault=[['Águilas','#5286FF',90],['Titanes','#F46A7B',120],['Nova','#3CDAAE',60],['Órbita','#F6BD63',40]];
function gameBar(after=false){return `<div class="gamebar"><div class="game-logo"><span class="mark">Q</span><div>QUIZ<br>STUDIO</div></div><div class="game-actions">${B('Salir','btn-quiet','arrow','data-go="exitDialog"')}${B('Historial','btn-quiet','history','data-go="historyModal"')}${B('Finalizar','btn-danger','power','data-go="finishDialog"')}</div><div class="scoreboard">${teamsDefault.map(t=>`<div class="score" style="--team:${t[1]}"><div class="score-name"><span class="dot" style="background:${t[1]}"></span>${t[0]}</div><div class="score-value"><b>${t[2]+(after&&t[0]==='Águilas'?30:0)}</b><div class="score-ticks"><span class="small-btn">−10</span><span class="small-btn">+10</span></div></div></div>`).join('')}</div></div>`}
const cs=[['Ciencia','#3cdeb6','#1e5248','#3d907d','spark'],['Historia','#e4b05f','#4d3a26','#9a7641','book'],['Deportes','#6d9cf9','#223c64','#4577b5','target'],['Arte','#b88cf6','#463061','#7e64b1','palette'],['Geografía','#e98d78','#53302e','#aa5a4e','globe']];
function gameScreen(body,after=false){return `<div class="screen play">${gameBar(after)}${body}</div>`}
function board(all=false){return gameScreen(`<main class="play-content"><div class="game-heading"><div class="page-kicker">Partida activa</div><h1>RETO DE CULTURA GENERAL</h1><span class="game-stamp">${ic('grid')} ${all?'0':'18'} cartas disponibles</span></div><section class="board">${cs.map((c,i)=>`<div class="board-cat" style="--cat:${c[1]};--catSoft:${c[2]};--catStroke:${c[3]}"><div class="board-cat-head">${ic(c[4])}<b>${c[0]}</b></div>${[50,40,30,20,10].map((val,j)=>{const used=all||[[false,true,false,false,true],[true,false,false,true,false],[false,false,true,false,false],[false,false,false,true,false],[true,false,false,false,false]][i][j];return `<div class="point-tile ${used?'used':''}" ${!used?'data-go="question"':''}>${used?`<span class="used-check">${ic('check')} USADA</span>`:val}</div>`}).join('')}</div>`).join('')}</section>${all?`<div style="text-align:center;margin-top:20px"><span class="chip chip-green">${ic('check','sm')} No quedan cartas. Puedes finalizar la partida.</span>&nbsp; ${B('Finalizar partida','btn-primary','trophy','data-go="finishDialog"')}</div>`:''}</main>`)}
function question(withImage=true){return gameScreen(`<main class="play-content"><div class="question-stage"><div class="question-pill"><span class="chip">${ic('spark','sm')} CIENCIA</span><span class="chip" style="color:#ffdf91;border-color:#8c754d">30 PUNTOS</span></div><div class="qbox"><div class="qtop"><div class="qtext">¿Cuál es el planeta más grande del sistema solar?</div>${withImage?`<div class="qillustration stars"><div class="jupiter"></div></div>`:''}</div><div class="answers">${['Marte','Júpiter','Saturno','Neptuno'].map((x,i)=>`<div class="answer"><span class="answer-letter">${'ABCD'[i]}</span>${x}</div>`).join('')}</div></div><div class="question-foot">${B('Volver al tablero','btn-quiet btn-lg','grid','data-go="board"')}${B('Mostrar respuesta','btn-primary btn-lg','check','data-go="answer"')}</div><div style="text-align:center;margin-top:19px" class="note">La respuesta aún no está visible para los participantes.</div></div></main>`)}

function answer(){return gameScreen(`<main class="play-content" style="padding-top:25px"><div class="question-stage" style="max-width:1170px;margin:2px auto"><div class="question-pill"><span class="chip">${ic('spark','sm')} CIENCIA</span><span class="chip" style="color:#ffdf91">30 PUNTOS</span></div><div class="qbox" style="padding:24px 36px"><div class="qtext" style="font-size:32px;text-align:center;margin:0 0 19px;max-width:none">¿Cuál es el planeta más grande del sistema solar?</div><div class="answers">${['Marte','Júpiter','Saturno','Neptuno'].map((x,i)=>`<div class="answer ${i===1?'correct':''}" style="height:56px"><span class="answer-letter" style="width:32px;height:32px">${'ABCD'[i]}</span>${x}${i===1?`<span style="margin-left:auto">${ic('check')}</span>`:''}</div>`).join('')}</div><div class="reveal"><span style="color:#80f4c8">${ic('check','xl')}</span><div><div class="reveal-title">RESPUESTA CORRECTA</div><div class="reveal-answer">Júpiter</div></div></div></div><div class="award"><div class="award-title">Asignar puntos</div><div class="award-hint">Selecciona el equipo que acertó para sumar 30 puntos.</div><div class="award-row">${teamsDefault.map(t=>`<div class="award-btn" style="--team:${t[1]}"><span class="award-dot"></span><b>+30</b><span>${t[0]}</span></div>`).join('')}</div></div><div class="question-foot" style="margin-top:18px">${B('Volver al tablero','btn-quiet btn-lg','grid','data-go="board"')}</div></div></main>`,true)}
const records=[['Reto de cultura general','General','10/10/2026 · 11:52','#3d58a6','FINALIZADA','Águilas',120,'Titanes',120,'Empate: Águilas, Titanes'],['Cine y series','Entretenimiento','08/10/2026 · 19:26','#973b62','EN CURSO','Luna',40,'Sol',30,'Partida en progreso'],['Historia del Perú','Historia','04/10/2026 · 10:40','#a17447','FINALIZADA','Incas',160,'Andes',110,'Ganador: Incas'],['Música 2000','Música','02/10/2026 · 20:19','#6550a3','FINALIZADA','Pop',90,'Rock',100,'Ganador: Rock']];

function confirmation(which){let data={finish:['Finalizar partida','¿Guardar el resultado final en el historial?','Cancelar','Finalizar partida','trophy'],exit:['Salir de la partida','La partida en curso quedará guardada en el historial.','Continuar jugando','Salir','power'],delete:['Eliminar juego','¿Eliminar “Reto de cultura general”? El historial se conservará.','Cancelar','Eliminar juego','trash'],saved:['Partida guardada','Resultado guardado. Ganadores: Águilas y Titanes.','', 'Entendido','check']}[which];return overlay(which==='delete'?library():board(),modalContent(`<div class="closing"><div class="modal-icon">${ic(data[4],'xl')}</div><h2 style="font-size:28px;margin:0 0 11px">${data[0]}</h2><p style="font-size:15px;color:#b0bed4;line-height:1.6;margin:0 auto;max-width:390px">${data[1]}</p><div class="vcenter gap12" style="justify-content:center;margin-top:28px">${data[2]?B(data[2],'btn-quiet btn-lg','','data-go="board"'):''}${B(data[3],which==='delete'?'btn-danger btn-lg':'btn-primary btn-lg',which==='saved'?'check':'',`data-go="${which==='finish'?'saved':which==='delete'?'library':which==='exit'?'library':'history'}"`)}</div></div>`,530))}
function guide(){return `<div style="position:absolute;top:24px;left:24px;color:#fff"> </div>`}

function questionsNoQs(){return app(`${editorHead()}${tabs('questions')}<div class="question-columns"><section class="panel category-list"><div class="between"><h3 class="group-title">Categorías</h3>${B('','btn-primary btn-icon','plus')}</div><div class="category-row active" style="margin-top:30px"><span class="dot" style="background:#43DAB0"></span>Ciencia<span class="count-pill">0</span></div></section><section class="panel question-table"><div class="toolbar"><div><h3 class="group-title" style="margin:0">Preguntas · Ciencia</h3><div class="note">Esta categoría aún no contiene cartas.</div></div>${B('Nueva pregunta','btn-primary','plus','data-go="questionModal"')}</div><div class="empty" style="width:100%;height:387px;margin:36px 0 0"><div class="empty-ico">${ic('file','xl')}</div><h2>Sin preguntas</h2><p>Añade una pregunta para que esta categoría aparezca en el tablero.</p>${B('Nueva pregunta','btn-primary','plus','data-go="questionModal"')}</div></section></div>`,'games','editor-work')}

const screens={historyEmpty,questionsNoCats,questionsNoQs,boardNoCats,noQuestionsDialog,unsavedDialog,library:()=>library(),menu:()=>library(true),empty,identity,teams,questions,categoryModal,questionModal,prepare,board:()=>board(false),allUsed:()=>board(true),question:()=>question(true),questionPlain,answer,history:historyView,historyModal,finishDialog:()=>confirmation('finish'),exitDialog:()=>confirmation('exit'),deleteDialog:()=>confirmation('delete'),saved:()=>confirmation('saved')};
let currentScreen=new URLSearchParams(location.search).get('screen')||'library';function render(){let key=currentScreen;document.getElementById('root').innerHTML=(screens[key]||screens.library)();document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{const to=el.dataset.go;currentScreen=to;try{window.history.replaceState({},'',`?screen=${to}`)}catch(e){};render()}));}
