name: Crear instalador Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    name: Quiz Studio para Windows
    runs-on: windows-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias de compilación
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.0"
          choco install innosetup --no-progress --yes

      - name: Crear aplicación, instalador y archivo portable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "Quiz Studio" --add-data "web_ui.html;." --add-data "desktop_ui.js;." --add-data "game_data.json;." --add-data "config.example.json;." --add-data "seed;seed" --collect-all PyQt5.QtWebEngineWidgets main.py
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging\windows\QuizStudio.iss"
          New-Item -ItemType Directory -Path "dist\portable" -Force | Out-Null
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          & $csc /nologo /target:winexe /out:"dist\portable\QuizStudioLauncher.exe" /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:System.Windows.Forms.dll "packaging\windows\PortableLauncher.cs"
          if ($LASTEXITCODE -ne 0) { throw "No se pudo compilar el lanzador portable." }
          & "packaging\windows\build_portable.ps1" -RuntimeDirectory "dist\Quiz Studio" -LauncherPath "dist\portable\QuizStudioLauncher.exe" -OutputPath "dist\portable\QuizStudio-Portable.exe"

      - name: Subir instalador listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: QuizStudio-Setup-Windows
          path: dist/installer/QuizStudio-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Subir archivo portable listo para compartir
        uses: actions/upload-artifact@v4
        with:
          name: QuizStudio-Portable-Windows
          path: dist/portable/QuizStudio-Portable.exe
          if-no-files-found: error
          retention-days: 14
